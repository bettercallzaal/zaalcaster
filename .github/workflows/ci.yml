name: CI

# Runs on every PR and on main, so a red merge is visible on main too.
# No install step: package.json has no dependencies, and no secrets are set,
# so nothing here can post. The one test that touches fetch stubs it to throw.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
